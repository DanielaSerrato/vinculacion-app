<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Capital Cargo Colombia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A1A1A;--red:#E32526;--red-dark:#C41E1F;--white:#FFFFFF;
  --gray-50:#F8F9FA;--gray-100:#F1F3F5;--gray-200:#DEE2E6;--gray-300:#CED4DA;
  --gray-400:#ADB5BD;--gray-500:#868E96;--gray-600:#495057;--gray-700:#343A40;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --transition:all .25s cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-700);line-height:1.6;min-height:100vh}

/* ===== Sidebar layout ===== */
.app-layout{display:flex;min-height:100vh}
.sidebar{
  width:260px;background:var(--navy);color:var(--white);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  z-index:100;transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-brand{padding:1.5rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand h1{font-size:1rem;font-weight:800;letter-spacing:.1em;line-height:1.3}
.sidebar-brand .red{color:var(--red)}
.sidebar-brand p{font-size:.7rem;color:rgba(255,255,255,.45);letter-spacing:.06em;margin-top:.15rem}
.sidebar-nav{flex:1;padding:1rem 0}
.nav-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.7rem 1.25rem;font-size:.82rem;font-weight:600;
  color:rgba(255,255,255,.55);cursor:pointer;transition:var(--transition);
  border-left:3px solid transparent;
}
.nav-item:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--white);background:rgba(255,255,255,.07);border-left-color:var(--red)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-count{
  margin-left:auto;background:rgba(255,255,255,.1);
  padding:.1rem .5rem;border-radius:10px;font-size:.68rem;font-weight:700;
  min-width:28px;text-align:center;
}
.nav-item.active .nav-count{background:var(--red)}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-footer a{color:rgba(255,255,255,.45);text-decoration:none;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:.5rem;transition:var(--transition)}
.sidebar-footer a:hover{color:var(--white)}
.sidebar-footer a svg{width:16px;height:16px}

/* Main content */
.main-content{margin-left:260px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.top-bar{
  background:var(--white);border-bottom:1px solid var(--gray-200);
  padding:.85rem 1.75rem;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);
}
.top-bar-left{display:flex;align-items:center;gap:.75rem}
.top-bar h2{font-size:1.05rem;font-weight:700;color:var(--navy)}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:.25rem;color:var(--navy)}
.hamburger svg{width:24px;height:24px}
.top-bar-right{display:flex;align-items:center;gap:.5rem}

.content-area{flex:1;padding:1.5rem 1.75rem;max-width:1200px;width:100%}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.45rem .85rem;border-radius:var(--radius);font-size:.78rem;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;transition:var(--transition);
  line-height:1.4;white-space:nowrap;
}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--red);color:var(--white);border-color:var(--red)}
.btn-primary:hover{background:var(--red-dark);border-color:var(--red-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(227,37,38,.25)}
.btn-outline{background:var(--white);color:var(--gray-600);border-color:var(--gray-200)}
.btn-outline:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--gray-500);border-color:transparent;padding:.35rem .6rem}
.btn-ghost:hover{color:var(--red);background:rgba(227,37,38,.05)}
.btn-dark{background:var(--navy);color:var(--white);border-color:var(--navy)}
.btn-dark:hover{opacity:.88;transform:translateY(-1px)}
.btn-danger{background:var(--white);color:#C92A2A;border-color:#FFE3E3}
.btn-danger:hover{background:#FFF5F5;border-color:#C92A2A}
.btn-sm{padding:.3rem .6rem;font-size:.72rem}
.btn-icon{padding:.4rem;border-radius:8px}

.toggle-btn{background:var(--white);border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:.45rem .85rem;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--gray-600);transition:var(--transition)}
.toggle-btn:hover{border-color:var(--red);color:var(--red)}
.toggle-btn.active{background:var(--navy);color:var(--white);border-color:var(--navy)}

/* ===== Spinner ===== */
.spinner-wrap{display:flex;justify-content:center;padding:4rem 0}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:16px;height:16px;border:2px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Badge ===== */
.badge{
  display:inline-flex;align-items:center;gap:.25rem;
  padding:.2rem .6rem;border-radius:20px;font-size:.68rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;
}
.badge-pendiente{background:#FFF3CD;color:#856404}
.badge-revisado{background:#D0EBFF;color:#1864AB}
.badge-aprobado{background:#D3F9D8;color:#2B8A3E}
.badge-rechazado{background:#FFE3E3;color:#C92A2A}
.badge-success{background:#D3F9D8;color:#2B8A3E}
.badge-fail{background:#FFE3E3;color:#C92A2A}
.badge-expired{background:#FFE3E3;color:#C92A2A}
.badge-pending-runt{background:#FFF3CD;color:#856404}
.badge-activo{background:#D3F9D8;color:#2B8A3E}
.badge-vigente{background:#D3F9D8;color:#2B8A3E}
.badge-vencida{background:#FFE3E3;color:#C92A2A}

/* ===== Card ===== */
.cards{display:flex;flex-direction:column;gap:.85rem}
.card{
  background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);border:1px solid var(--gray-200);
  overflow:hidden;transition:var(--transition);
  animation:cardIn .35s cubic-bezier(.4,0,.2,1) both;
}
.card:hover{box-shadow:var(--shadow)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;cursor:pointer;gap:.75rem;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.card-header:hover{background:var(--gray-50)}
.card-header-left{display:flex;align-items:center;gap:.85rem;min-width:0}
.card-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--navy),#333);
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:.82rem;font-weight:800;flex-shrink:0;
  overflow:hidden;
}
.card-avatar img{width:100%;height:100%;object-fit:cover}
.card-title{font-size:.88rem;font-weight:700;color:var(--navy);line-height:1.3}
.card-sub{font-size:.75rem;color:var(--gray-500);margin-top:.1rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.card-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.expand-arrow{
  color:var(--gray-400);font-size:.85rem;transition:transform .25s cubic-bezier(.4,0,.2,1);
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;
}
.card.open .expand-arrow{transform:rotate(90deg)}

/* Card detail */
.card-detail{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1);
}
.card.open .card-detail{grid-template-rows:1fr}
.card-detail-inner{overflow:hidden}
.card-detail-content{padding:0 1.25rem 1.25rem;border-top:1px solid var(--gray-100)}

/* RUNT summary strip (shown in card header area, always visible) */
.runt-strip{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.65rem 1.25rem;background:var(--gray-50);border-top:1px solid var(--gray-100);
  font-size:.78rem;
}
.runt-strip-item{display:flex;align-items:center;gap:.3rem;color:var(--gray-600)}
.runt-strip-item strong{color:var(--navy);font-weight:700}
.runt-strip-item .badge{margin-left:.15rem}
.runt-strip-sep{width:1px;height:16px;background:var(--gray-300)}

/* Detail grid */
.section-title{
  font-size:.75rem;font-weight:700;color:var(--gray-500);
  text-transform:uppercase;letter-spacing:.06em;
  margin:1.25rem 0 .65rem;padding-bottom:.4rem;border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;gap:.5rem;
}
.section-title:first-child{margin-top:.75rem}
.section-title svg{width:14px;height:14px;opacity:.5}

.detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:.4rem .85rem;font-size:.8rem;
}
.detail-grid dt{color:var(--gray-500);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;padding-top:.15rem}
.detail-grid dd{color:var(--navy);word-break:break-word;font-weight:500}

/* Document thumbnails */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.65rem;margin-top:.5rem}
.doc-thumb{
  position:relative;border-radius:var(--radius);overflow:hidden;
  border:1.5px solid var(--gray-200);cursor:pointer;
  aspect-ratio:4/3;background:var(--gray-100);
  transition:var(--transition);display:flex;flex-direction:column;
}
.doc-thumb:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:var(--shadow)}
.doc-thumb img{width:100%;height:100%;object-fit:cover;flex:1}
.doc-thumb-label{
  padding:.3rem .4rem;font-size:.62rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;color:var(--gray-600);background:var(--white);
  text-align:center;border-top:1px solid var(--gray-100);
}
.doc-missing{
  border-radius:var(--radius);border:1.5px dashed var(--gray-300);
  aspect-ratio:4/3;background:var(--gray-50);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--gray-400);font-size:.62rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;gap:.25rem;
}
.doc-missing svg{width:20px;height:20px;opacity:.4}

/* RUNT section */
.runt-section{
  margin-top:1rem;padding:1rem;background:var(--gray-50);
  border-radius:var(--radius);border:1px solid var(--gray-200);
}
.runt-section h4{
  font-size:.78rem;font-weight:700;color:var(--navy);margin-bottom:.6rem;
  display:flex;align-items:center;gap:.5rem;
}
.runt-section .detail-grid{margin-top:.35rem}
.runt-actions{display:flex;gap:.5rem;margin-top:.75rem;align-items:center}

/* Card actions */
.card-actions{
  display:flex;gap:.5rem;margin-top:1.25rem;padding-top:.85rem;
  border-top:1px solid var(--gray-100);flex-wrap:wrap;align-items:center;
}
.card-actions-right{margin-left:auto;display:flex;gap:.5rem}

/* Edit mode */
.edit-input{
  width:100%;padding:.35rem .55rem;border:1.5px solid var(--gray-300);
  border-radius:8px;font-size:.8rem;font-family:inherit;transition:var(--transition);
  background:var(--white);
}
.edit-input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,37,38,.1)}
.edit-select{
  padding:.35rem .55rem;border:1.5px solid var(--gray-300);
  border-radius:8px;font-size:.8rem;font-family:inherit;
  background:var(--white);transition:var(--transition);
}
.edit-select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,37,38,.1)}

/* Group by placa */
.group-section{
  background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);border:1px solid var(--gray-200);
  margin-bottom:.85rem;overflow:hidden;
  animation:cardIn .35s cubic-bezier(.4,0,.2,1) both;
}
.group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;cursor:pointer;transition:background .15s;
}
.group-header:hover{background:var(--gray-50)}
.group-header h3{font-size:.9rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:.5rem}
.group-header .badge{margin-left:.25rem}
.group-body{display:none;padding:.85rem 1.25rem}
.group-section.open .group-body{display:block}
.group-sub-title{
  font-size:.7rem;font-weight:700;color:var(--gray-500);
  text-transform:uppercase;letter-spacing:.06em;
  margin:1rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--gray-100);
}
.group-sub-title:first-child{margin-top:0}
.group-card{
  background:var(--gray-50);border-radius:var(--radius);
  padding:.85rem;margin-bottom:.5rem;border:1px solid var(--gray-200);
  transition:var(--transition);
}
.group-card:hover{border-color:var(--gray-300)}
.group-card .card-title{font-size:.82rem}

/* ===== Lightbox ===== */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  z-index:2000;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .25s cubic-bezier(.4,0,.2,1);
  backdrop-filter:blur(4px);
}
.lightbox.active{opacity:1;visibility:visible}
.lightbox img{
  max-width:90vw;max-height:85vh;border-radius:var(--radius);
  box-shadow:0 16px 64px rgba(0,0,0,.4);
  transform:scale(.92);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.lightbox.active img{transform:scale(1)}
.lightbox-close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(255,255,255,.12);border:none;color:var(--white);
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;transition:var(--transition);
}
.lightbox-close:hover{background:rgba(255,255,255,.25)}
.lightbox-label{
  position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:var(--white);padding:.4rem 1rem;
  border-radius:20px;font-size:.78rem;font-weight:600;
}

/* ===== Modal (history) ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:1500;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .25s;backdrop-filter:blur(2px);
}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{
  background:var(--white);border-radius:var(--radius-lg);
  width:90%;max-width:640px;max-height:85vh;overflow:hidden;
  box-shadow:var(--shadow-lg);
  transform:translateY(12px);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.modal-overlay.active .modal{transform:none}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;border-bottom:1px solid var(--gray-100);flex-shrink:0;
}
.modal-header h3{font-size:.95rem;font-weight:700;color:var(--navy)}
.modal-body{overflow-y:auto;padding:1rem 1.25rem;flex:1}
.modal-close{
  background:none;border:none;cursor:pointer;color:var(--gray-400);
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.modal-close:hover{background:var(--gray-100);color:var(--navy)}
.history-entry{
  padding:.85rem;border-radius:var(--radius);border:1px solid var(--gray-200);
  margin-bottom:.6rem;font-size:.8rem;
}
.history-entry:last-child{margin-bottom:0}
.history-entry .detail-grid{margin-top:.35rem}
.history-date{font-size:.7rem;color:var(--gray-500);font-weight:600;margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem}

/* ===== Login overlay ===== */
.login-overlay{
  position:fixed;inset:0;
  background:linear-gradient(135deg,var(--navy) 0%,#2a2a2a 100%);
  display:flex;align-items:center;justify-content:center;z-index:5000;
}
.login-box{
  background:var(--white);border-radius:var(--radius-lg);
  padding:2.5rem 2rem;width:90%;max-width:380px;text-align:center;
  box-shadow:0 16px 64px rgba(0,0,0,.3);
}
.login-box .login-logo{
  width:56px;height:56px;border-radius:14px;
  background:var(--navy);color:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:900;margin:0 auto 1.25rem;
}
.login-box h2{font-size:1.15rem;color:var(--navy);margin-bottom:.15rem;font-weight:800}
.login-box p{font-size:.82rem;color:var(--gray-500);margin-bottom:1.5rem}
.login-box input{
  width:100%;padding:.7rem 1rem;border:1.5px solid var(--gray-300);
  border-radius:var(--radius);font-size:.88rem;margin-bottom:.85rem;
  outline:none;transition:var(--transition);
}
.login-box input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,37,38,.1)}
.login-box button{
  width:100%;padding:.75rem;background:var(--red);color:var(--white);
  border:none;border-radius:var(--radius);font-size:.88rem;font-weight:700;
  cursor:pointer;transition:var(--transition);
}
.login-box button:hover{background:var(--red-dark);transform:translateY(-1px);box-shadow:0 4px 16px rgba(227,37,38,.3)}
.login-error{color:var(--red);font-size:.8rem;margin-bottom:.65rem;display:none;font-weight:600}

.empty-msg{text-align:center;padding:3rem;color:var(--gray-500);font-size:.88rem}

/* Overlay for mobile sidebar */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:90;backdrop-filter:blur(2px);
}

/* ===== Search bar ===== */
.search-bar{
  position:relative;max-width:320px;
}
.search-bar input{
  width:100%;padding:.45rem .75rem .45rem 2rem;
  border:1.5px solid var(--gray-200);border-radius:var(--radius);
  font-size:.8rem;font-family:inherit;outline:none;transition:var(--transition);
  background:var(--gray-50);
}
.search-bar input:focus{border-color:var(--red);background:var(--white);box-shadow:0 0 0 3px rgba(227,37,38,.08)}
.search-bar svg{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--gray-400)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .hamburger{display:flex}
  .content-area{padding:1rem}
  .detail-grid{grid-template-columns:1fr;gap:.2rem}
  .detail-grid dd{margin-bottom:.4rem}
  .docs-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .top-bar{padding:.75rem 1rem}
  .search-bar{max-width:100%;flex:1}
  .top-bar-right{flex-wrap:wrap}
}
@media(max-width:480px){
  .docs-grid{grid-template-columns:repeat(3,1fr)}
  .runt-strip{flex-direction:column;align-items:flex-start;gap:.35rem}
  .runt-strip-sep{display:none}
}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">CC</div>
    <h2><span class="red">Capital</span> Cargo Colombia</h2>
    <p>Panel de Administracion</p>
    <div class="login-error" id="loginError">Contrasena incorrecta</div>
    <input type="password" id="loginPass" placeholder="Contrasena" autocomplete="off">
    <button onclick="checkLogin()">Ingresar</button>
  </div>
</div>

<!-- App -->
<div id="appContent" style="display:none">
<div class="app-layout">

  <!-- Sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1><span class="red">Capital</span> Cargo</h1>
      <p>Panel de Administracion</p>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="nav-item active" data-tab="conductores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Conductores
        <span class="nav-count" id="count-conductores">-</span>
      </div>
      <div class="nav-item" data-tab="propietarios">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://kidvrjpelcyjrvonpimf.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZHZyanBlbGN5anJ2b25waW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDc0ODcsImV4cCI6MjEwODE4MzQ4N30.Wz7ceDsvmBZtSnad1cHV972pnOXXaE00VoGkt0bqF-g';
const STORAGE_BASE = SUPA_URL + '/storage/v1/object/public/vinculacion-docs/';
const ENRICH_URL = SUPA_URL + '/functions/v1/enrich-runt';
const PASSWORD = 'capitalcargo2026';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let activeTab = 'conductores';
let cache = {};
let runtLicAll = [];   // ALL runt_licencias records
let runtLicCache = {}; // latest per cedula
let runtVehAll = [];   // ALL runt_vehiculos records
let runtVehCache = {}; // latest per placa
let groupByPlaca = false;
let searchQuery = '';

// ===== Auth gate =====
function checkLogin() {
  const v = document.getElementById('loginPass').value;
  if (v === PASSWORD) {
    sessionStorage.setItem('cc_admin', '1');
    showApp();
  } else {
    const err = document.getElementById('loginError');
    err.style.display = 'block';
    err.style.animation = 'none';
    err.offsetHeight; // reflow
    err.style.animation = 'shake .4s ease';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadAllData();
}

if (sessionStorage.getItem('cc_admin') === '1') showApp();

// ===== Sidebar (mobile) =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ===== Tabs via sidebar nav =====
document.getElementById('sidebarNav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  item.classList.add('active');
  activeTab = item.dataset.tab;
  document.getElementById('pageTitle').textContent = {conductores:'Conductores',propietarios:'Propietarios',vehiculos:'Vehiculos'}[activeTab];
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  updateGroupToggle();
  loadTab(activeTab);
  closeSidebar();
});

function updateGroupToggle() {
  const btn = document.getElementById('groupToggle');
  btn.style.display = (activeTab === 'propietarios') ? 'none' : '';
  btn.classList.toggle('active', groupByPlaca);
}

// ===== Data loading =====
async function loadAllData() {
  await Promise.all([loadRuntLicencias(), loadRuntVehiculos()]);
  loadTab(activeTab);
  loadAllCounts();
}

async function loadRuntLicencias() {
  const { data } = await sb.from('runt_licencias').select('*');
  runtLicAll = data || [];
  runtLicCache = {};
  runtLicAll.forEach(r => {
    if (!runtLicCache[r.cedula] || new Date(r.fecha_consulta) > new Date(runtLicCache[r.cedula].fecha_consulta)) {
      runtLicCache[r.cedula] = r;
    }
  });
}

async function loadRuntVehiculos() {
  const { data } = await sb.from('runt_vehiculos').select('*');
  runtVehAll = data || [];
  runtVehCache = {};
  runtVehAll.forEach(r => {
    if (!runtVehCache[r.placa] || new Date(r.fecha_consulta) > new Date(runtVehCache[r.placa].fecha_consulta)) {
      runtVehCache[r.placa] = r;
    }
  });
}

async function loadTab(table, force) {
  const content = document.getElementById('content');
  if (cache[table] && !force) { renderTab(table, cache[table]); return; }
  content.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false });
  if (error) { content.innerHTML = '<div class="empty-msg">Error: ' + error.message + '</div>'; return; }
  cache[table] = data || [];
  document.getElementById('count-' + table).textContent = (data || []).length;
  updateGroupToggle();
  renderTab(table, data || []);
}

function refreshTab() {
  delete cache[activeTab];
  Promise.all([loadRuntLicencias(), loadRuntVehiculos()]).then(() => loadTab(activeTab, true));
}

// ===== Search / Filter =====
function filterCards() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  if (cache[activeTab]) renderTab(activeTab, cache[activeTab]);
}

function matchesSearch(r) {
  if (!searchQuery) return true;
  const searchable = [
    r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido,
    r.cedula, r.vehiculo_placa, r.placa, r.tipo, r.ciudad, r.telefono, r.estado
  ].filter(Boolean).join(' ').toLowerCase();
  return searchable.includes(searchQuery);
}

// ===== Rendering =====
function renderTab(table, rows) {
  const content = document.getElementById('content');
  const filtered = rows.filter(matchesSearch);

  if (!filtered.length) {
    content.innerHTML = '<div class="empty-msg">' + (rows.length ? 'No hay resultados para la busqueda' : 'No hay registros') + '</div>';
    return;
  }

  if (groupByPlaca && table !== 'propietarios') {
    content.innerHTML = renderGroupedByPlaca(table, filtered);
  } else {
    let html = '<div class="cards">';
    filtered.forEach((r, i) => { html += renderCard(table, r, i); });
    html += '</div>';
    content.innerHTML = html;
  }
}

function toggleGroupByPlaca() {
  groupByPlaca = !groupByPlaca;
  updateGroupToggle();
  renderTab(activeTab, cache[activeTab] || []);
}

// ===== Group by placa =====
function renderGroupedByPlaca(table, rows) {
  const placas = {};
  rows.forEach(r => {
    const p = (table === 'vehiculos') ? r.placa : r.vehiculo_placa;
    if (!p) return;
    if (!placas[p]) placas[p] = { conductores: [], propietarios: [], vehiculos: [] };
    placas[p][table].push(r);
  });

  const otherTables = ['conductores', 'propietarios', 'vehiculos'].filter(t => t !== table);
  otherTables.forEach(t => {
    (cache[t] || []).forEach(r => {
      const p = (t === 'vehiculos') ? r.placa : r.vehiculo_placa;
      if (!p || !placas[p]) return;
      placas[p][t].push(r);
    });
  });

  const noPlaca = rows.filter(r => {
    const p = (table === 'vehiculos') ? r.placa : r.vehiculo_placa;
    return !p;
  });

  let html = '';
  Object.keys(placas).sort().forEach(placa => {
    const g = placas[placa];
    const runtVeh = runtVehCache[placa];
    html += '<div class="group-section">';
    html += '<div class="group-header" onclick="this.parentElement.classList.toggle(\'open\')">';
    html += '<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> ' + esc(placa);
    if (runtVeh && runtVeh.marca) html += ' <span style="font-weight:400;color:var(--gray-500);font-size:.82rem">' + esc(runtVeh.marca) + ' ' + esc(runtVeh.linea) + ' ' + esc(runtVeh.modelo) + '</span>';
    html += '</h3>';
    html += '<span class="expand-arrow">&#8250;</span>';
    html += '</div><div class="group-body">';

    if (g.conductores.length) {
      html += '<div class="group-sub-title">Conductores</div>';
      g.conductores.forEach(r => {
        const name = fullName(r);
        html += '<div class="group-card"><div class="card-title">' + name + '</div><div class="card-sub" style="margin-top:.25rem">CC ' + esc(r.cedula) + ' ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (g.propietarios.length) {
      html += '<div class="group-sub-title">Propietarios</div>';
      g.propietarios.forEach(r => {
        const name = fullName(r);
        html += '<div class="group-card"><div class="card-title">' + name + '</div><div class="card-sub" style="margin-top:.25rem">CC ' + esc(r.cedula) + ' ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (g.vehiculos.length) {
      html += '<div class="group-sub-title">Vehiculos</div>';
      g.vehiculos.forEach(r => {
        html += '<div class="group-card"><div class="card-title">Placa ' + esc(r.placa) + '</div><div class="card-sub" style="margin-top:.25rem">Tipo: ' + esc(r.tipo) + ' ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (runtVeh && runtVeh.success) {
      html += '<div class="group-sub-title">RUNT Vehiculo</div>';
      html += '<div class="group-card"><div class="card-sub">' + esc(runtVeh.marca) + ' ' + esc(runtVeh.linea) + ' ' + esc(runtVeh.modelo) + ' &middot; ' + esc(runtVeh.color) + ' &middot; SOAT: ' + esc(runtVeh.soat_estado) + '</div></div>';
    }
    html += '</div></div>';
  });

  if (noPlaca.length) {
    html += '<div class="group-section"><div class="group-header" onclick="this.parentElement.classList.toggle(\'open\')"><h3>Sin placa</h3><span class="expand-arrow">&#8250;</span></div>';
    html += '<div class="group-body"><div class="cards">';
    noPlaca.forEach((r, i) => { html += renderCard(table, r, i); });
    html += '</div></div></div>';
  }
  return html;
}

// ===== Card renderers =====
function renderCard(table, r, idx) {
  const renderers = { conductores: cardConductor, propietarios: cardPropietario, vehiculos: cardVehiculo };
  return renderers[table](r, idx);
}

// ===== RUNT API calls =====
async function consultarRuntLic(condId, cedula, primerApellido) {
  const section = document.getElementById('runt-lic-' + condId);
  if (!section) return;
  section.innerHTML = '<h4><span class="spinner-sm"></span> Consultando RUNT...</h4>';

  try {
    await fetch(ENRICH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPA_KEY },
      body: JSON.stringify({ tabla: 'conductores', datos: { cedula, primer_apellido: primerApellido } })
    });
    await loadRuntLicencias();
    delete cache[activeTab];
    loadTab(activeTab, true);
  } catch (err) {
    section.innerHTML = '<h4>Licencia RUNT <span class="badge badge-fail">ERROR</span></h4><p style="font-size:.78rem;color:#C92A2A">' + err.message + '</p>';
  }
}

function renderActions(table, r, uid) {
  let html = '<div class="card-actions" id="actions-' + uid + '">';
  html += '<button class="btn btn-outline" onclick="startEdit(\'' + table + '\', \'' + r.id + '\', \'' + uid + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar</button>';
  html += '<div class="card-actions-right">';
  html += '<button class="btn btn-danger btn-sm" onclick="deleteRecord(\'' + table + '\', \'' + r.id + '\', \'' + uid + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Eliminar</button>';
  html += '</div></div>';
  return html;
}

function startEdit(table, id, uid) {
  const card = document.getElementById('card-' + uid);
  if (!card) return;

  card.querySelectorAll('[data-edit-uid="' + uid + '"]').forEach(dd => {
    const field = dd.dataset.field;
    const val = dd.dataset.value || '';
    dd.innerHTML = '<input class="edit-input" data-field="' + field + '" value="' + escAttr(val) + '">';
  });

  const estadoEl = card.querySelector('[data-estado-uid="' + uid + '"]');
  if (estadoEl) {
    const current = estadoEl.dataset.value || 'pendiente';
    estadoEl.innerHTML = '<select class="edit-select" data-field="estado">' +
      ['pendiente', 'revisado', 'aprobado', 'rechazado'].map(s =>
        '<option value="' + s + '"' + (s === current.toLowerCase() ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'
      ).join('') + '</select>';
  }

  const actions = document.getElementById('actions-' + uid);
  actions.innerHTML = '<button class="btn btn-primary" onclick="saveEdit(\'' + table + '\', \'' + id + '\', \'' + uid + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><polyline points="20 6 9 17 4 12"/></svg> Guardar</button>' +
    '<button class="btn btn-outline" onclick="cancelEdit(\'' + table + '\')">Cancelar</button>';
}

async function saveEdit(table, id, uid) {
  const card = document.getElementById('card-' + uid);
  if (!card) return;

  const changes = {};
  card.querySelectorAll('.edit-input').forEach(input => {
    changes[input.dataset.field] = input.value || null;
  });
  card.querySelectorAll('.edit-select').forEach(select => {
    changes[select.dataset.field] = select.value;
  });

  if (Object.keys(changes).length === 0) { cancelEdit(table); return; }

  const saveBtn = card.querySelector('.btn-primary');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spinner-sm"></span> Guardando...'; }

  const { error } = await sb.from(table).update(changes).eq('id', id);
  if (error) { alert('Error guardando: ' + error.message); return; }

  if (cache[table]) {
    const idx = cache[table].findIndex(r => r.id === id);
    if (idx >= 0) Object.assign(cache[table][idx], changes);
  }
  delete cache[table];
  loadTab(table, true);
}

function cancelEdit(table) {
  delete cache[table];
  loadTab(table, true);
}

async function deleteRecord(table, id, uid) {
  if (!confirm('Eliminar este registro? Esta accion no se puede deshacer.')) return;

  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { alert('Error eliminando: ' + error.message); return; }

  if (cache[table]) {
    cache[table] = cache[table].filter(r => r.id !== id);
    document.getElementById('count-' + table).textContent = cache[table].length;
  }
  const card = document.getElementById('card-' + uid);
  if (card) {
    card.style.opacity = '0';
    card.style.transform = 'translateX(-20px)';
    card.style.transition = 'all .3s ease';
    setTimeout(() => card.remove(), 300);
  }
}

// ===== Helpers =====
function fullName(r) {
  return [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
}

function getInitials(r) {
  return ((r.primer_nombre || '').charAt(0) + (r.primer_apellido || '').charAt(0)).toUpperCase() || '?';
}

function dt(label, val) {
  if (typeof val === 'boolean') val = val ? 'Si' : 'No';
  return '<dt>' + label + '</dt><dd>' + (val != null && val !== '' ? val : '-') + '</dd>';
}

function dtEditable(uid, field, label, val) {
  return '<dt>' + label + '</dt><dd data-edit-uid="' + uid + '" data-field="' + field + '" data-value="' + escAttr(val) + '">' + esc(val) + '</dd>';
}

function fmtDate(d) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtDateShort(d) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric' });
}

function esc(v) {
  if (v == null) return '-';
  if (typeof v === 'boolean') return v ? 'Si' : 'No';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escAttr(v) {
  if (v == null) return '';
  return String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
}

function isExpired(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date();
}

function estadoBadge(v) {
  if (!v) return '';
  const cls = { pendiente:'badge-pendiente', revisado:'badge-revisado', aprobado:'badge-aprobado', rechazado:'badge-rechazado' }[v.toLowerCase()] || 'badge-pendiente';
  return '<span class="badge ' + cls + '">' + esc(v) + '</span>';
}

function estadoRuntBadge(v) {
  if (!v) return '-';
  const lower = v.toLowerCase();
  let cls = 'badge-pendiente';
  if (lower.includes('vigente') || lower.includes('activ')) cls = 'badge-vigente';
  else if (lower.includes('vencid') || lower.includes('cancel') || lower.includes('suspend')) cls = 'badge-vencida';
  return '<span class="badge ' + cls + '">' + esc(v) + '</span>';
}

function docThumb(val, label) {
  if (!val) {
    return '<div class="doc-missing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' + label + '</div>';
  }
  const url = STORAGE_BASE + val;
  return '<div class="doc-thumb" onclick="openLightbox(\'' + escAttr(url) + '\', \'' + escAttr(label) + '\')"><img src="' + escAttr(url) + '" alt="' + escAttr(label) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=padding:1rem;text-align:center;font-size:.65rem;color:var(--gray-500)>No se pudo cargar</div>\'"><div class="doc-thumb-label">' + label + '</div></div>';
}

function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

function cardWrap(title, sub, estado, detail, uid, avatarContent, stripHtml, idx) {
  const estadoHtml = estado ? '<span data-estado-uid="' + uid + '" data-value="' + escAttr(estado) + '">' + estadoBadge(estado) + '</span>' : '';
  const delay = Math.min((idx || 0) * 0.04, 0.4);
  let html = '<div class="card" id="card-' + uid + '" style="animation-delay:' + delay + 's">';
  html += '<div class="card-header" onclick="toggleCard(this)">';
  html += '<div class="card-header-left">';
  html += '<div class="card-avatar">' + (avatarContent || '?') + '</div>';
  html += '<div><div class="card-title">' + title + '</div><div class="card-sub">' + sub + '</div></div>';
  html += '</div>';
  html += '<div class="card-right">' + estadoHtml + ' <span class="expand-arrow">&#8250;</span></div>';
  html += '</div>';
  if (stripHtml) html += stripHtml;
  html += '<div class="card-detail"><div class="card-detail-inner"><div class="card-detail-content">' + detail + '</div></div></div>';
  html += '</div>';
  return html;
}

// Load counts
async function loadAllCounts() {
  for (const t of ['conductores', 'propietarios', 'vehiculos']) {
    const { count, error } = await sb.from(t).select('*', { count: 'exact', head: true });
    if (!error && count != null) document.getElementById('count-' + t).textContent = count;
  }
}
</script>
