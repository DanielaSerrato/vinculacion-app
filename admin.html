<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Capital Cargo Colombia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1A1A1A;--red:#E32526;--white:#FFFFFF;--gray-50:#F8F9FA;--gray-100:#F1F3F5;--gray-200:#DEE2E6;--gray-300:#CED4DA;--gray-400:#ADB5BD;--gray-500:#868E96;--gray-600:#495057;--gray-700:#343A40;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.1)}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:var(--gray-50);color:var(--gray-700);line-height:1.6;min-height:100vh}
header{background:var(--white);color:var(--navy);padding:1.25rem 1rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.1);border-bottom:3px solid var(--red)}
header h1{font-size:1.35rem;letter-spacing:.12em;font-weight:800;margin-bottom:.15rem}
header p{font-size:.85rem;color:var(--gray-500);letter-spacing:.04em}
.red{color:var(--red)}
.top-bar{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;padding:.75rem 1rem}
.top-bar a{color:var(--red);text-decoration:none;font-size:.85rem;font-weight:600}
.top-bar a:hover{text-decoration:underline}

/* Tabs */
.tabs-wrap{max-width:900px;margin:0 auto;padding:0 1rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.5rem;padding:.5rem 0;min-width:max-content}
.tab-btn{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:.5rem 1rem;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--gray-600)}
.tab-btn:hover{border-color:var(--red);color:var(--red)}
.tab-btn.active{background:var(--red);color:var(--white);border-color:var(--red)}
.tab-count{display:inline-block;background:rgba(0,0,0,.12);border-radius:10px;padding:0 .5rem;font-size:.7rem;margin-left:.35rem}
.tab-btn.active .tab-count{background:rgba(255,255,255,.3)}

/* Content area */
.content{max-width:900px;margin:0 auto;padding:1rem}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.toolbar h2{font-size:1rem;color:var(--navy)}
.refresh-btn{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:.4rem .85rem;font-size:.8rem;cursor:pointer;color:var(--gray-600);transition:all .2s}
.refresh-btn:hover{border-color:var(--red);color:var(--red)}

/* Spinner */
.spinner-wrap{display:flex;justify-content:center;padding:3rem 0}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Cards */
.cards{display:flex;flex-direction:column;gap:.75rem}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--red);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;gap:.75rem;-webkit-tap-highlight-color:transparent}
.card-header:hover{background:var(--gray-50)}
.card-title{font-size:.9rem;font-weight:700;color:var(--navy)}
.card-sub{font-size:.78rem;color:var(--gray-500);margin-top:.15rem}
.card-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.expand-arrow{color:var(--gray-400);font-size:1.1rem;transition:transform .2s}
.card.open .expand-arrow{transform:rotate(90deg)}

/* Badge */
.badge{display:inline-block;padding:.15rem .55rem;border-radius:10px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-pendiente{background:#FFF3CD;color:#856404}
.badge-revisado{background:#D0EBFF;color:#1864AB}
.badge-aprobado{background:#D3F9D8;color:#2B8A3E}
.badge-rechazado{background:#FFE3E3;color:#C92A2A}
.badge-success{background:#D3F9D8;color:#2B8A3E}
.badge-fail{background:#FFE3E3;color:#C92A2A}
.badge-expired{background:#FFE3E3;color:#C92A2A}

/* Card detail */
.card-detail{display:none;padding:0 1.25rem 1rem;border-top:1px solid var(--gray-100)}
.card.open .card-detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .75rem;font-size:.78rem;margin-top:.75rem}
.detail-grid dt{color:var(--gray-500);font-weight:600}
.detail-grid dd{color:var(--navy);word-break:break-word}
.file-link{color:var(--red);text-decoration:none;font-weight:600}
.file-link:hover{text-decoration:underline}
.file-check{color:#2B8A3E;font-weight:700}
.file-missing{color:#C92A2A;font-weight:700}

/* Login overlay */
.login-overlay{position:fixed;inset:0;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--white);border-radius:var(--radius);padding:2rem;width:90%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.login-box h2{font-size:1.1rem;color:var(--navy);margin-bottom:.25rem}
.login-box p{font-size:.82rem;color:var(--gray-500);margin-bottom:1.25rem}
.login-box input{width:100%;padding:.65rem .85rem;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:.9rem;margin-bottom:.75rem;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:.65rem;background:var(--red);color:var(--white);border:none;border-radius:var(--radius);font-size:.9rem;font-weight:700;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-error{color:var(--red);font-size:.8rem;margin-bottom:.5rem;display:none}

.empty-msg{text-align:center;padding:2rem;color:var(--gray-500);font-size:.88rem}

@media(max-width:600px){
  .detail-grid{grid-template-columns:1fr;gap:.25rem}
  .detail-grid dd{margin-bottom:.35rem}
  .content{padding:.75rem}
  .card-header{padding:.85rem 1rem}
}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2><span class="red">Capital</span> Cargo Colombia</h2>
    <p>Panel de Administracion</p>
    <div class="login-error" id="loginError">Contrasena incorrecta</div>
    <input type="password" id="loginPass" placeholder="Contrasena" autocomplete="off">
    <button onclick="checkLogin()">Ingresar</button>
  </div>
</div>

<div id="appContent" style="display:none">

<header>
  <h1><span class="red">Capital</span> Cargo Colombia</h1>
  <p>Panel de Administracion</p>
</header>

<div class="top-bar">
  <a href="index.html">&larr; Volver</a>
  <span style="font-size:.78rem;color:var(--gray-400)">Admin</span>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="conductores">Conductores <span class="tab-count" id="count-conductores">-</span></button>
    <button class="tab-btn" data-tab="propietarios">Propietarios <span class="tab-count" id="count-propietarios">-</span></button>
    <button class="tab-btn" data-tab="vehiculos">Vehiculos <span class="tab-count" id="count-vehiculos">-</span></button>
    <button class="tab-btn" data-tab="runt_licencias">RUNT Licencias <span class="tab-count" id="count-runt_licencias">-</span></button>
    <button class="tab-btn" data-tab="runt_vehiculos">RUNT Vehiculos <span class="tab-count" id="count-runt_vehiculos">-</span></button>
  </div>
</div>

<div class="content" id="content">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

</div><!-- /appContent -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://kidvrjpelcyjrvonpimf.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZHZyanBlbGN5anJ2b25waW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDc0ODcsImV4cCI6MjEwODE4MzQ4N30.Wz7ceDsvmBZtSnad1cHV972pnOXXaE00VoGkt0bqF-g';
const STORAGE_BASE = SUPA_URL + '/storage/v1/object/public/vinculacion-docs/';
const PASSWORD = 'capitalcargo2026';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let activeTab = 'conductores';
let cache = {};

// --- Auth gate ---
function checkLogin() {
  const v = document.getElementById('loginPass').value;
  if (v === PASSWORD) {
    sessionStorage.setItem('cc_admin', '1');
    showApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadTab(activeTab);
}

if (sessionStorage.getItem('cc_admin') === '1') {
  showApp();
}

// --- Tabs ---
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  loadTab(activeTab);
});

// --- Data loading ---
async function loadTab(table, force) {
  const content = document.getElementById('content');
  if (cache[table] && !force) {
    renderTab(table, cache[table]);
    return;
  }
  content.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  const { data, error } = await sb.from(table).select('*').order('created_at' in columnDefs[table] ? 'created_at' : 'id', { ascending: false });
  if (error) {
    content.innerHTML = '<div class="empty-msg">Error cargando datos: ' + error.message + '</div>';
    return;
  }
  cache[table] = data || [];
  document.getElementById('count-' + table).textContent = (data || []).length;
  renderTab(table, data || []);
}

// Has created_at?
const columnDefs = {
  conductores: { created_at: true },
  propietarios: { created_at: true },
  vehiculos: { created_at: true },
  runt_licencias: {},
  runt_vehiculos: {}
};

// Order column
function orderCol(table) {
  if (table === 'runt_licencias' || table === 'runt_vehiculos') return 'fecha_consulta';
  return 'created_at';
}

async function loadTab(table, force) {
  const content = document.getElementById('content');
  if (cache[table] && !force) { renderTab(table, cache[table]); return; }
  content.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  const col = orderCol(table);
  const { data, error } = await sb.from(table).select('*').order(col, { ascending: false });
  if (error) {
    content.innerHTML = '<div class="empty-msg">Error: ' + error.message + '</div>';
    return;
  }
  cache[table] = data || [];
  document.getElementById('count-' + table).textContent = (data || []).length;
  renderTab(table, data || []);
}

// --- Rendering ---
function renderTab(table, rows) {
  const content = document.getElementById('content');
  let html = '<div class="toolbar"><h2>' + tableName(table) + ' (' + rows.length + ')</h2><button class="refresh-btn" onclick="refreshTab()">Actualizar</button></div>';
  if (!rows.length) { html += '<div class="empty-msg">No hay registros</div>'; content.innerHTML = html; return; }
  html += '<div class="cards">';
  rows.forEach((r, i) => { html += renderCard(table, r, i); });
  html += '</div>';
  content.innerHTML = html;
}

function refreshTab() { delete cache[activeTab]; loadTab(activeTab, true); }

function tableName(t) {
  return { conductores: 'Conductores', propietarios: 'Propietarios', vehiculos: 'Vehiculos', runt_licencias: 'RUNT Licencias', runt_vehiculos: 'RUNT Vehiculos' }[t];
}

function estadoBadge(v) {
  if (!v) return '';
  const cls = { pendiente: 'badge-pendiente', revisado: 'badge-revisado', aprobado: 'badge-aprobado', rechazado: 'badge-rechazado' }[v.toLowerCase()] || 'badge-pendiente';
  return '<span class="badge ' + cls + '">' + v + '</span>';
}

function successBadge(v) {
  if (v === true) return '<span class="badge badge-success">OK</span>';
  if (v === false) return '<span class="badge badge-fail">FALLO</span>';
  return '-';
}

function fileIndicator(val, label) {
  if (!val) return '<span class="file-missing" title="No subido">&#10007; ' + label + '</span>';
  const url = STORAGE_BASE + val;
  return '<a class="file-link" href="' + url + '" target="_blank" rel="noopener">&#10003; ' + label + '</a>';
}

function esc(v) {
  if (v == null) return '-';
  if (typeof v === 'boolean') return v ? 'Si' : 'No';
  return String(v);
}

function isExpired(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date();
}

function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

// --- Card renderers per table ---
function renderCard(table, r, idx) {
  const renderers = { conductores: cardConductor, propietarios: cardPropietario, vehiculos: cardVehiculo, runt_licencias: cardRuntLic, runt_vehiculos: cardRuntVeh };
  return renderers[table](r, idx);
}

function cardConductor(r) {
  const name = [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
  let detail = '<dl class="detail-grid">';
  detail += dt('ID', r.id) + dt('Creado', fmtDate(r.created_at)) + dt('Cedula', r.cedula);
  detail += dt('Direccion', r.direccion) + dt('Ciudad', r.ciudad) + dt('Telefono', r.telefono);
  detail += dt('Banco', r.banco) + dt('Tipo cuenta', r.tipo_cuenta) + dt('Num. cuenta', r.numero_cuenta);
  detail += dt('Ref. familiar', (r.ref_familiar_nombre || '-') + ' / ' + (r.ref_familiar_telefono || '-'));
  detail += dt('Ref. empresa', (r.ref_empresa_nombre || '-') + ' / ' + (r.ref_empresa_telefono || '-'));
  detail += dt('Autoriza datos', esc(r.autoriza_datos)) + dt('Autoriza sensibles', esc(r.autoriza_sensibles));
  detail += '</dl>';
  detail += '<div style="margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.78rem">';
  detail += fileIndicator(r.foto_rostro, 'Foto rostro') + ' ';
  detail += fileIndicator(r.seguridad_social, 'Seg. social') + ' ';
  detail += fileIndicator(r.cedula_frente, 'Cedula frente') + ' ';
  detail += fileIndicator(r.cedula_reverso, 'Cedula reverso') + ' ';
  detail += fileIndicator(r.pase_frente, 'Pase frente') + ' ';
  detail += fileIndicator(r.pase_reverso, 'Pase reverso') + ' ';
  detail += fileIndicator(r.cert_bancaria, 'Cert. bancaria');
  detail += '</div>';
  return cardWrap(name, 'CC ' + esc(r.cedula) + ' &middot; Placa ' + esc(r.vehiculo_placa), r.estado, detail);
}

function cardPropietario(r) {
  const name = [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
  let detail = '<dl class="detail-grid">';
  detail += dt('ID', r.id) + dt('Creado', fmtDate(r.created_at)) + dt('Cedula', r.cedula);
  detail += dt('Direccion', r.direccion) + dt('Ciudad', r.ciudad) + dt('Telefono', r.telefono);
  detail += dt('Banco', r.banco) + dt('Tipo cuenta', r.tipo_cuenta) + dt('Num. cuenta', r.numero_cuenta);
  detail += dt('Factura electronica', esc(r.factura_electronica)) + dt('Autoriza sensibles', esc(r.autoriza_sensibles));
  detail += '</dl>';
  detail += '<div style="margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.78rem">';
  detail += fileIndicator(r.cedula_frente, 'Cedula frente') + ' ';
  detail += fileIndicator(r.cedula_reverso, 'Cedula reverso') + ' ';
  detail += fileIndicator(r.rut, 'RUT') + ' ';
  detail += fileIndicator(r.cert_bancaria, 'Cert. bancaria');
  detail += '</div>';
  return cardWrap(name, 'CC ' + esc(r.cedula) + ' &middot; Placa ' + esc(r.vehiculo_placa), r.estado, detail);
}

function cardVehiculo(r) {
  let detail = '<dl class="detail-grid">';
  detail += dt('ID', r.id) + dt('Creado', fmtDate(r.created_at));
  detail += dt('Placa', r.placa) + dt('Tipo', r.tipo);
  detail += dt('Satelital', r.satelital) + dt('Usuario', r.satelital_usuario) + dt('Password', r.satelital_password);
  detail += '</dl>';
  detail += '<div style="margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.78rem">';
  detail += fileIndicator(r.tarjeta_frente, 'Tarjeta frente') + ' ';
  detail += fileIndicator(r.tarjeta_reverso, 'Tarjeta reverso') + ' ';
  detail += fileIndicator(r.tecnomecanica, 'Tecnomecanica') + ' ';
  detail += fileIndicator(r.soat, 'SOAT') + ' ';
  if (r.fotos && Array.isArray(r.fotos)) {
    r.fotos.forEach((f, i) => { detail += fileIndicator(f, 'Foto ' + (i + 1)) + ' '; });
  }
  detail += '</div>';
  return cardWrap('Placa ' + esc(r.placa), 'Tipo: ' + esc(r.tipo), r.estado, detail);
}

function cardRuntLic(r) {
  const name = [r.nombre, r.apellidos].filter(Boolean).join(' ');
  const expired = isExpired(r.fecha_vencimiento_cat);
  let detail = '<dl class="detail-grid">';
  detail += dt('ID', r.id) + dt('Consulta', fmtDate(r.fecha_consulta));
  detail += dt('Cedula', r.cedula) + dt('Estado conductor', r.estado_conductor);
  detail += dt('Estado persona', r.estado_persona) + dt('Num. licencia', r.numero_licencia);
  detail += dt('Estado licencia', r.estado_licencia) + dt('Categoria', r.categoria);
  detail += dt('Expedicion', r.fecha_expedicion_cat);
  detail += dt('Vencimiento', r.fecha_vencimiento_cat ? '<span class="' + (expired ? 'badge badge-expired' : '') + '">' + r.fecha_vencimiento_cat + (expired ? ' (VENCIDA)' : '') + '</span>' : '-');
  detail += dt('Metodo', r.metodo) + dt('Error', r.error);
  detail += '</dl>';
  const sub = 'CC ' + esc(r.cedula) + ' &middot; Lic. ' + esc(r.numero_licencia);
  return cardWrapRunt(name || 'Sin nombre', sub, r.success, expired, detail);
}

function cardRuntVeh(r) {
  let detail = '<dl class="detail-grid">';
  detail += dt('ID', r.id) + dt('Consulta', fmtDate(r.fecha_consulta));
  detail += dt('Placa', r.placa) + dt('Cedula', r.cedula) + dt('Estado', r.estado);
  detail += dt('Marca', r.marca) + dt('Linea', r.linea) + dt('Modelo', r.modelo) + dt('Color', r.color);
  detail += dt('SOAT poliza', r.soat_poliza) + dt('SOAT vencimiento', r.soat_vencimiento) + dt('SOAT estado', r.soat_estado);
  detail += dt('Metodo', r.metodo) + dt('Error', r.error);
  detail += '</dl>';
  const sub = esc(r.marca) + ' ' + esc(r.linea) + ' ' + esc(r.modelo) + ' &middot; ' + esc(r.color);
  return cardWrapRunt('Placa ' + esc(r.placa), sub, r.success, false, detail);
}

// --- Helpers ---
function dt(label, val) {
  return '<dt>' + label + '</dt><dd>' + (val != null && val !== '' ? val : '-') + '</dd>';
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function cardWrap(title, sub, estado, detail) {
  return '<div class="card"><div class="card-header" onclick="toggleCard(this)"><div><div class="card-title">' + title + '</div><div class="card-sub">' + sub + '</div></div><div class="card-right">' + estadoBadge(estado) + ' <span class="expand-arrow">&#8250;</span></div></div><div class="card-detail">' + detail + '</div></div>';
}

function cardWrapRunt(title, sub, success, expired, detail) {
  let badges = successBadge(success);
  if (expired) badges += ' <span class="badge badge-expired">VENCIDA</span>';
  return '<div class="card"><div class="card-header" onclick="toggleCard(this)"><div><div class="card-title">' + title + '</div><div class="card-sub">' + sub + '</div></div><div class="card-right">' + badges + ' <span class="expand-arrow">&#8250;</span></div></div><div class="card-detail">' + detail + '</div></div>';
}

// Load counts for all tabs on init
async function loadAllCounts() {
  const tables = ['conductores', 'propietarios', 'vehiculos', 'runt_licencias', 'runt_vehiculos'];
  for (const t of tables) {
    const { count, error } = await sb.from(t).select('*', { count: 'exact', head: true });
    if (!error && count != null) {
      document.getElementById('count-' + t).textContent = count;
    }
  }
}

if (sessionStorage.getItem('cc_admin') === '1') {
  loadAllCounts();
}
</script>
</body>
</html>
