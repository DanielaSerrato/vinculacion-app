<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Capital Cargo Colombia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1A1A1A;--red:#E32526;--white:#FFFFFF;--gray-50:#F8F9FA;--gray-100:#F1F3F5;--gray-200:#DEE2E6;--gray-300:#CED4DA;--gray-400:#ADB5BD;--gray-500:#868E96;--gray-600:#495057;--gray-700:#343A40;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.1)}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:var(--gray-50);color:var(--gray-700);line-height:1.6;min-height:100vh}
header{background:var(--white);color:var(--navy);padding:1.25rem 1rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.1);border-bottom:3px solid var(--red)}
header h1{font-size:1.35rem;letter-spacing:.12em;font-weight:800;margin-bottom:.15rem}
header p{font-size:.85rem;color:var(--gray-500);letter-spacing:.04em}
.red{color:var(--red)}
.top-bar{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:.75rem 1rem}
.top-bar a{color:var(--red);text-decoration:none;font-size:.85rem;font-weight:600}
.top-bar a:hover{text-decoration:underline}

/* Tabs */
.tabs-wrap{max-width:960px;margin:0 auto;padding:0 1rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.5rem;padding:.5rem 0;min-width:max-content}
.tab-btn{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:.5rem 1rem;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--gray-600)}
.tab-btn:hover{border-color:var(--red);color:var(--red)}
.tab-btn.active{background:var(--red);color:var(--white);border-color:var(--red)}
.tab-count{display:inline-block;background:rgba(0,0,0,.12);border-radius:10px;padding:0 .5rem;font-size:.7rem;margin-left:.35rem}
.tab-btn.active .tab-count{background:rgba(255,255,255,.3)}

/* Content area */
.content{max-width:960px;margin:0 auto;padding:1rem}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.toolbar h2{font-size:1rem;color:var(--navy)}
.toolbar-right{display:flex;gap:.5rem;align-items:center}
.refresh-btn,.toggle-btn{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:.4rem .85rem;font-size:.8rem;cursor:pointer;color:var(--gray-600);transition:all .2s}
.refresh-btn:hover,.toggle-btn:hover{border-color:var(--red);color:var(--red)}
.toggle-btn.active{background:var(--red);color:var(--white);border-color:var(--red)}

/* Spinner */
.spinner-wrap{display:flex;justify-content:center;padding:3rem 0}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:18px;height:18px;border:2px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Cards */
.cards{display:flex;flex-direction:column;gap:.75rem}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--red);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;gap:.75rem;-webkit-tap-highlight-color:transparent}
.card-header:hover{background:var(--gray-50)}
.card-title{font-size:.9rem;font-weight:700;color:var(--navy)}
.card-sub{font-size:.78rem;color:var(--gray-500);margin-top:.15rem}
.card-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.expand-arrow{color:var(--gray-400);font-size:1.1rem;transition:transform .2s}
.card.open .expand-arrow{transform:rotate(90deg)}

/* Badge */
.badge{display:inline-block;padding:.15rem .55rem;border-radius:10px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-pendiente{background:#FFF3CD;color:#856404}
.badge-revisado{background:#D0EBFF;color:#1864AB}
.badge-aprobado{background:#D3F9D8;color:#2B8A3E}
.badge-rechazado{background:#FFE3E3;color:#C92A2A}
.badge-success{background:#D3F9D8;color:#2B8A3E}
.badge-fail{background:#FFE3E3;color:#C92A2A}
.badge-expired{background:#FFE3E3;color:#C92A2A}
.badge-pending-runt{background:#FFF3CD;color:#856404}

/* Card detail */
.card-detail{display:none;padding:0 1.25rem 1rem;border-top:1px solid var(--gray-100)}
.card.open .card-detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .75rem;font-size:.78rem;margin-top:.75rem}
.detail-grid dt{color:var(--gray-500);font-weight:600}
.detail-grid dd{color:var(--navy);word-break:break-word}
.file-link{color:var(--red);text-decoration:none;font-weight:600}
.file-link:hover{text-decoration:underline}
.file-check{color:#2B8A3E;font-weight:700}
.file-missing{color:#C92A2A;font-weight:700}

/* RUNT section inside cards */
.runt-section{margin-top:1rem;padding:.85rem;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-200)}
.runt-section h4{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
.runt-section .detail-grid{margin-top:.35rem}

/* Action buttons */
.card-actions{display:flex;gap:.5rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.btn{padding:.35rem .75rem;border-radius:var(--radius);font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s}
.btn-edit{background:var(--white);border-color:var(--gray-300);color:var(--gray-600)}
.btn-edit:hover{border-color:var(--red);color:var(--red)}
.btn-delete{background:var(--white);border-color:#FFE3E3;color:#C92A2A;font-size:.72rem}
.btn-delete:hover{background:#FFE3E3}
.btn-save{background:var(--red);color:var(--white);border-color:var(--red)}
.btn-save:hover{opacity:.9}
.btn-cancel{background:var(--white);border-color:var(--gray-300);color:var(--gray-600)}
.btn-cancel:hover{background:var(--gray-100)}
.btn-runt{background:var(--navy);color:var(--white);border-color:var(--navy);font-size:.72rem}
.btn-runt:hover{opacity:.85}

/* Edit mode */
.edit-input{width:100%;padding:.3rem .5rem;border:1px solid var(--gray-300);border-radius:4px;font-size:.78rem;font-family:inherit}
.edit-input:focus{outline:none;border-color:var(--red)}
.edit-select{padding:.3rem .5rem;border:1px solid var(--gray-300);border-radius:4px;font-size:.78rem;font-family:inherit}

/* Group by placa */
.group-section{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden;border-left:4px solid var(--navy)}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;background:var(--gray-50);border-bottom:1px solid var(--gray-100)}
.group-header:hover{background:var(--gray-100)}
.group-header h3{font-size:.92rem;font-weight:700;color:var(--navy)}
.group-header .badge{margin-left:.5rem}
.group-body{display:none;padding:.75rem}
.group-section.open .group-body{display:block}
.group-sub-title{font-size:.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .35rem;padding-bottom:.25rem;border-bottom:1px solid var(--gray-100)}
.group-sub-title:first-child{margin-top:0}
.group-card{background:var(--gray-50);border-radius:var(--radius);padding:.85rem;margin-bottom:.5rem;border:1px solid var(--gray-200)}
.group-card .card-title{font-size:.82rem}

/* Login overlay */
.login-overlay{position:fixed;inset:0;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--white);border-radius:var(--radius);padding:2rem;width:90%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.login-box h2{font-size:1.1rem;color:var(--navy);margin-bottom:.25rem}
.login-box p{font-size:.82rem;color:var(--gray-500);margin-bottom:1.25rem}
.login-box input{width:100%;padding:.65rem .85rem;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:.9rem;margin-bottom:.75rem;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:.65rem;background:var(--red);color:var(--white);border:none;border-radius:var(--radius);font-size:.9rem;font-weight:700;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-error{color:var(--red);font-size:.8rem;margin-bottom:.5rem;display:none}

.empty-msg{text-align:center;padding:2rem;color:var(--gray-500);font-size:.88rem}

@media(max-width:600px){
  .detail-grid{grid-template-columns:1fr;gap:.25rem}
  .detail-grid dd{margin-bottom:.35rem}
  .content{padding:.75rem}
  .card-header{padding:.85rem 1rem}
  .toolbar{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2><span class="red">Capital</span> Cargo Colombia</h2>
    <p>Panel de Administracion</p>
    <div class="login-error" id="loginError">Contrasena incorrecta</div>
    <input type="password" id="loginPass" placeholder="Contrasena" autocomplete="off">
    <button onclick="checkLogin()">Ingresar</button>
  </div>
</div>

<div id="appContent" style="display:none">

<header>
  <h1><span class="red">Capital</span> Cargo Colombia</h1>
  <p>Panel de Administracion</p>
</header>

<div class="top-bar">
  <a href="index.html">&larr; Volver</a>
  <span style="font-size:.78rem;color:var(--gray-400)">Admin</span>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="conductores">Conductores <span class="tab-count" id="count-conductores">-</span></button>
    <button class="tab-btn" data-tab="propietarios">Propietarios <span class="tab-count" id="count-propietarios">-</span></button>
    <button class="tab-btn" data-tab="vehiculos">Vehiculos <span class="tab-count" id="count-vehiculos">-</span></button>
  </div>
</div>

<div class="content" id="content">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

</div><!-- /appContent -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://kidvrjpelcyjrvonpimf.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZHZyanBlbGN5anJ2b25waW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDc0ODcsImV4cCI6MjEwODE4MzQ4N30.Wz7ceDsvmBZtSnad1cHV972pnOXXaE00VoGkt0bqF-g';
const STORAGE_BASE = SUPA_URL + '/storage/v1/object/public/vinculacion-docs/';
const ENRICH_URL = SUPA_URL + '/functions/v1/enrich-runt';
const PASSWORD = 'capitalcargo2026';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let activeTab = 'conductores';
let cache = {};
let runtLicCache = {};  // keyed by cedula
let runtVehCache = {};  // keyed by placa
let groupByPlaca = false;

// ========== Auth gate ==========
function checkLogin() {
  const v = document.getElementById('loginPass').value;
  if (v === PASSWORD) {
    sessionStorage.setItem('cc_admin', '1');
    showApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadAllData();
}

if (sessionStorage.getItem('cc_admin') === '1') {
  showApp();
}

// ========== Load all data including RUNT ==========
async function loadAllData() {
  // Load RUNT data into caches first, then load active tab
  await Promise.all([loadRuntLicencias(), loadRuntVehiculos()]);
  loadTab(activeTab);
  loadAllCounts();
}

async function loadRuntLicencias() {
  const { data } = await sb.from('runt_licencias').select('*');
  runtLicCache = {};
  if (data) {
    data.forEach(r => {
      // Keep latest per cedula
      if (!runtLicCache[r.cedula] || new Date(r.fecha_consulta) > new Date(runtLicCache[r.cedula].fecha_consulta)) {
        runtLicCache[r.cedula] = r;
      }
    });
  }
}

async function loadRuntVehiculos() {
  const { data } = await sb.from('runt_vehiculos').select('*');
  runtVehCache = {};
  if (data) {
    data.forEach(r => {
      if (!runtVehCache[r.placa] || new Date(r.fecha_consulta) > new Date(runtVehCache[r.placa].fecha_consulta)) {
        runtVehCache[r.placa] = r;
      }
    });
  }
}

// ========== Tabs ==========
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  loadTab(activeTab);
});

// ========== Data loading ==========
async function loadTab(table, force) {
  const content = document.getElementById('content');
  if (cache[table] && !force) { renderTab(table, cache[table]); return; }
  content.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false });
  if (error) {
    content.innerHTML = '<div class="empty-msg">Error: ' + error.message + '</div>';
    return;
  }
  cache[table] = data || [];
  document.getElementById('count-' + table).textContent = (data || []).length;
  renderTab(table, data || []);
}

function refreshTab() {
  delete cache[activeTab];
  // Also refresh RUNT caches
  Promise.all([loadRuntLicencias(), loadRuntVehiculos()]).then(() => {
    loadTab(activeTab, true);
  });
}

// ========== Rendering ==========
function renderTab(table, rows) {
  const content = document.getElementById('content');
  const tname = { conductores: 'Conductores', propietarios: 'Propietarios', vehiculos: 'Vehiculos' }[table];

  let html = '<div class="toolbar"><h2>' + tname + ' (' + rows.length + ')</h2>';
  html += '<div class="toolbar-right">';
  if (table !== 'propietarios') {
    html += '<button class="toggle-btn' + (groupByPlaca ? ' active' : '') + '" onclick="toggleGroupByPlaca()">Agrupar por placa</button>';
  }
  html += '<button class="refresh-btn" onclick="refreshTab()">Actualizar</button>';
  html += '</div></div>';

  if (!rows.length) { html += '<div class="empty-msg">No hay registros</div>'; content.innerHTML = html; return; }

  if (groupByPlaca && table !== 'propietarios') {
    html += renderGroupedByPlaca(table, rows);
  } else {
    html += '<div class="cards">';
    rows.forEach(r => { html += renderCard(table, r); });
    html += '</div>';
  }
  content.innerHTML = html;
}

function toggleGroupByPlaca() {
  groupByPlaca = !groupByPlaca;
  renderTab(activeTab, cache[activeTab] || []);
}

// ========== Group by placa view ==========
function renderGroupedByPlaca(table, rows) {
  // Collect all placas
  const placas = {};
  rows.forEach(r => {
    const p = (table === 'vehiculos') ? r.placa : r.vehiculo_placa;
    if (!p) return;
    if (!placas[p]) placas[p] = { conductores: [], propietarios: [], vehiculos: [] };
    placas[p][table].push(r);
  });

  // Also pull from other cached tables
  const otherTables = ['conductores', 'propietarios', 'vehiculos'].filter(t => t !== table);
  otherTables.forEach(t => {
    (cache[t] || []).forEach(r => {
      const p = (t === 'vehiculos') ? r.placa : r.vehiculo_placa;
      if (!p || !placas[p]) return;
      placas[p][t].push(r);
    });
  });

  // Handle rows with no placa
  const noPlaca = rows.filter(r => {
    const p = (table === 'vehiculos') ? r.placa : r.vehiculo_placa;
    return !p;
  });

  let html = '';
  Object.keys(placas).sort().forEach(placa => {
    const g = placas[placa];
    const runtVeh = runtVehCache[placa];
    html += '<div class="group-section">';
    html += '<div class="group-header" onclick="this.parentElement.classList.toggle(\'open\')">';
    html += '<h3>Placa ' + esc(placa);
    if (runtVeh && runtVeh.marca) html += ' &middot; ' + esc(runtVeh.marca) + ' ' + esc(runtVeh.linea) + ' ' + esc(runtVeh.modelo);
    html += '</h3>';
    html += '<span class="expand-arrow">&#8250;</span>';
    html += '</div>';
    html += '<div class="group-body">';

    if (g.conductores.length) {
      html += '<div class="group-sub-title">Conductores</div>';
      g.conductores.forEach(r => {
        const name = [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
        html += '<div class="group-card"><div class="card-title">' + name + '</div><div class="card-sub">CC ' + esc(r.cedula) + ' &middot; ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (g.propietarios.length) {
      html += '<div class="group-sub-title">Propietarios</div>';
      g.propietarios.forEach(r => {
        const name = [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
        html += '<div class="group-card"><div class="card-title">' + name + '</div><div class="card-sub">CC ' + esc(r.cedula) + ' &middot; ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (g.vehiculos.length) {
      html += '<div class="group-sub-title">Vehiculos</div>';
      g.vehiculos.forEach(r => {
        html += '<div class="group-card"><div class="card-title">Placa ' + esc(r.placa) + '</div><div class="card-sub">Tipo: ' + esc(r.tipo) + ' &middot; ' + estadoBadge(r.estado) + '</div></div>';
      });
    }
    if (runtVeh) {
      html += '<div class="group-sub-title">RUNT Vehiculo</div>';
      html += '<div class="group-card"><div class="card-sub">' + esc(runtVeh.marca) + ' ' + esc(runtVeh.linea) + ' ' + esc(runtVeh.modelo) + ' &middot; ' + esc(runtVeh.color) + ' &middot; SOAT: ' + esc(runtVeh.soat_estado) + '</div></div>';
    }

    html += '</div></div>';
  });

  if (noPlaca.length) {
    html += '<div class="group-section"><div class="group-header" onclick="this.parentElement.classList.toggle(\'open\')"><h3>Sin placa</h3><span class="expand-arrow">&#8250;</span></div>';
    html += '<div class="group-body"><div class="cards">';
    noPlaca.forEach(r => { html += renderCard(table, r); });
    html += '</div></div></div>';
  }

  return html;
}

// ========== Card renderers ==========
function renderCard(table, r) {
  const renderers = { conductores: cardConductor, propietarios: cardPropietario, vehiculos: cardVehiculo };
  return renderers[table](r);
}

function cardConductor(r) {
  const name = [r.primer_nombre, r.segundo_nombre, r.primer_apellido, r.segundo_apellido].filter(Boolean).join(' ');
  const uid = 'cond-' + r.id;
  let detail = '<dl class="detail-grid" id="fields-' + uid + '">';
  detail += dtEditable(uid, 'primer_nombre', 'Primer nombre', r.primer_nombre);
  detail += dtEditable(uid, 'segundo_nombre', 'Segundo nombre', r.segundo_nombre);
  detail += dtEditable(uid, 'primer_apellido', 'Primer apellido', r.primer_apellido);
  detail += dtEditable(uid, 'segundo_apellido', 'Segundo apellido', r.segundo_apellido);
  detail += dt('ID', r.id) + dt('Creado', fmtDate(r.created_at));
  detail += dtEditable(uid, 'cedula', 'Cedula', r.cedula);
  detail += dtEditable(uid, 'direccion', 'Direccion', r.direccion);
  detail += dtEditable(uid, 'ciudad', 'Ciudad', r.ciudad);
  detail += dtEditable(uid, 'telefono', 'Telefono', r.telefono);
  detail += dtEditable(uid, 'banco', 'Banco', r.banco);
  detail += dtEditable(uid, 'tipo_cuenta', 'Tipo cuenta', r.tipo_cuenta);
  detail += dtEditable(uid, 'numero_cuenta', 'Num. cuenta', r.numero_cuenta);
  detail += dtEditable(uid, 'vehiculo_placa', 'Placa vehiculo', r.vehiculo_placa);
  detail += dt('Ref. familiar', (r.ref_familiar_nombre || '-') + ' / ' + (r.ref_familiar_telefono || '-'));
  detail += dt('Ref. empresa', (r.ref_empresa_nombre || '-') + ' / ' + (r.ref_empresa_telefono || '-'));
  detail += dt('Autoriza datos', esc(r.autoriza_datos)) + dt('Autoriza sensibles', esc(r.autoriza_sensibles));
  detail += '</dl>';
  detail += '<div style="margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.78rem">';
  detail += fileIndicator(r.foto_rostro, 'Foto rostro') + ' ';
  detail += fileIndicator(r.seguridad_social, 'Seg. social') + ' ';
  detail += fileIndicator(r.cedula_frente, 'Cedula frente') + ' ';
  detail += fileIndicator(r.cedula_reverso, 'Cedula reverso') + ' ';
  detail += fileIndicator(r.pase_frente, 'Pase frente') + ' ';
  detail += fileIndicator(r.pase_reverso, 'Pase reverso') + ' ';
  detail += fileIndicator(r.cert_bancaria, 'Cert. bancaria');
  detail += '</div>';

  // RUNT Licencia section
  detail += renderRuntLicSection(r);

  // Action buttons
  detail += renderActions('conductores', r, uid);

// ========== RUNT sections embedded in cards ==========
function renderRuntLicSection(conductor) {
  const runt = runtLicCache[conductor.cedula];
  let html = '<div class="runt-section" id="runt-lic-' + conductor.id + '">';
  html += '<h4>Licencia RUNT ';

  if (!runt) {
    html += '<span class="badge badge-pending-runt">Pendiente</span></h4>';
    html += '<p style="font-size:.78rem;color:var(--gray-500);margin-bottom:.5rem">No se ha consultado la licencia en RUNT.</p>';
    html += '<button class="btn btn-runt" onclick="consultarRuntLic(' + conductor.id + ', \'' + esc(conductor.cedula) + '\', \'' + esc(conductor.primer_apellido) + '\')">Consultar RUNT</button>';
  } else {
    const expired = isExpired(runt.fecha_vencimiento_cat);
    if (runt.success) {
      html += '<span class="badge badge-success">OK</span>';
      if (expired) html += ' <span class="badge badge-expired">VENCIDA</span>';
    } else {
      html += '<span class="badge badge-fail">FALLO</span>';
    }
    html += '</h4>';
    html += '<dl class="detail-grid">';
    html += dt('Estado conductor', runt.estado_conductor);
    html += dt('Estado licencia', runt.estado_licencia);
    html += dt('Categoria', runt.categoria);
    html += dt('Vencimiento', runt.fecha_vencimiento_cat ? runt.fecha_vencimiento_cat + (expired ? ' <span class="badge badge-expired">VENCIDA</span>' : '') : '-');
    html += dt('Restricciones', runt.restricciones || 'Ninguna');
    html += dt('Num. licencia', runt.numero_licencia);
    html += dt('Organismo transito', runt.organismo_transito);
    html += dt('Consulta', fmtDate(runt.fecha_consulta));
    if (runt.error) html += dt('Error', runt.error);
    html += '</dl>';
    html += '<div style="margin-top:.5rem"><button class="btn btn-runt" onclick="consultarRuntLic(' + conductor.id + ', \'' + esc(conductor.cedula) + '\', \'' + esc(conductor.primer_apellido) + '\')">Consultar RUNT</button></div>';
  }
  html += '</div>';
  return html;
}

// ========== RUNT API calls ==========
async function consultarRuntLic(condId, cedula, primerApellido) {
  const section = document.getElementById('runt-lic-' + condId);
  if (!section) return;
  section.innerHTML = '<h4>Licencia RUNT <span class="spinner-sm"></span> Consultando...</h4>';

  try {
    const resp = await fetch(ENRICH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPA_KEY },
      body: JSON.stringify({ tabla: 'conductores', datos: { cedula: cedula, primer_apellido: primerApellido } })
    });
    const result = await resp.json();
    // Refresh RUNT cache and re-render
    await loadRuntLicencias();
    delete cache[activeTab];
    loadTab(activeTab, true);
  } catch (err) {
    section.innerHTML = '<h4>Licencia RUNT <span class="badge badge-fail">ERROR</span></h4><p style="font-size:.78rem;color:#C92A2A">' + err.message + '</p>';
  }
}

async function consultarRuntVeh(vehId, placa) {
  const section = document.getElementById('runt-veh-' + vehId);
  if (!section) return;
  section.innerHTML = '<h4>RUNT Vehiculo <span class="spinner-sm"></span> Consultando...</h4>';

  try {
    const resp = await fetch(ENRICH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPA_KEY },
      body: JSON.stringify({ tabla: 'vehiculos', datos: { placa: placa } })
    });
    const result = await resp.json();

  }
}

// ========== Edit / Delete / Actions ==========
function renderActions(table, r, uid) {
  let html = '<div class="card-actions" id="actions-' + uid + '">';
  html += '<button class="btn btn-edit" onclick="startEdit(\'' + table + '\', ' + r.id + ', \'' + uid + '\')">Editar</button>';
  html += '<button class="btn btn-delete" onclick="deleteRecord(\'' + table + '\', ' + r.id + ', \'' + uid + '\')">Eliminar</button>';
  html += '</div>';
  return html;
}

function startEdit(table, id, uid) {
  const card = document.getElementById('card-' + uid);
  if (!card) return;

  // Convert display values to inputs
  card.querySelectorAll('[data-edit-uid="' + uid + '"]').forEach(dd => {
    const field = dd.dataset.field;
    const val = dd.dataset.value || '';
    dd.innerHTML = '<input class="edit-input" data-field="' + field + '" value="' + escAttr(val) + '">';
  });

  // Add estado dropdown
  const estadoEl = card.querySelector('[data-estado-uid="' + uid + '"]');
  if (estadoEl) {
    const current = estadoEl.dataset.value || 'pendiente';
    estadoEl.innerHTML = '<select class="edit-select" data-field="estado">' +
      ['pendiente', 'revisado', 'aprobado', 'rechazado'].map(s =>
        '<option value="' + s + '"' + (s === current.toLowerCase() ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'
      ).join('') + '</select>';
  }

  // Replace action buttons
  const actions = document.getElementById('actions-' + uid);
  actions.innerHTML = '<button class="btn btn-save" onclick="saveEdit(\'' + table + '\', ' + id + ', \'' + uid + '\')">Guardar</button>' +
    '<button class="btn btn-cancel" onclick="cancelEdit(\'' + table + '\')">Cancelar</button>';
}

async function saveEdit(table, id, uid) {
  const card = document.getElementById('card-' + uid);
  if (!card) return;

  const changes = {};

  // Collect input values
  card.querySelectorAll('.edit-input').forEach(input => {
    changes[input.dataset.field] = input.value || null;
  });

  // Collect select values
  card.querySelectorAll('.edit-select').forEach(select => {
    changes[select.dataset.field] = select.value;
  });

  if (Object.keys(changes).length === 0) { cancelEdit(table); return; }

  const { error } = await sb.from(table).update(changes).eq('id', id);
  if (error) {
    alert('Error guardando: ' + error.message);
    return;
  }

  // Update cache
  if (cache[table]) {
    const idx = cache[table].findIndex(r => r.id === id);
    if (idx >= 0) Object.assign(cache[table][idx], changes);
  }

  // Re-render
  delete cache[table];
  loadTab(table, true);
}

function cancelEdit(table) {
  delete cache[table];
  loadTab(table, true);
}

async function deleteRecord(table, id, uid) {
  if (!confirm('Eliminar este registro?')) return;

  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) {
    alert('Error eliminando: ' + error.message);
    return;
  }

  // Remove from cache
  if (cache[table]) {
    cache[table] = cache[table].filter(r => r.id !== id);
    document.getElementById('count-' + table).textContent = cache[table].length;
  }

  // Remove card from DOM
  const card = document.getElementById('card-' + uid);
  if (card) card.remove();
}

// ========== Helpers ==========
function dt(label, val) {
  return '<dt>' + label + '</dt><dd>' + (val != null && val !== '' ? val : '-') + '</dd>';
}

function dtEditable(uid, field, label, val) {
  return '<dt>' + label + '</dt><dd data-edit-uid="' + uid + '" data-field="' + field + '" data-value="' + escAttr(val) + '">' + esc(val) + '</dd>';
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function esc(v) {
  if (v == null) return '-';
  if (typeof v === 'boolean') return v ? 'Si' : 'No';
  return String(v);
}

function escAttr(v) {
  if (v == null) return '';
  return String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function isExpired(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date();
}

function estadoBadge(v) {
  if (!v) return '';
  const cls = { pendiente: 'badge-pendiente', revisado: 'badge-revisado', aprobado: 'badge-aprobado', rechazado: 'badge-rechazado' }[v.toLowerCase()] || 'badge-pendiente';
  return '<span class="badge ' + cls + '">' + v + '</span>';
}

function fileIndicator(val, label) {
  if (!val) return '<span class="file-missing" title="No subido">&#10007; ' + label + '</span>';
  const url = STORAGE_BASE + val;
  return '<a class="file-link" href="' + url + '" target="_blank" rel="noopener">&#10003; ' + label + '</a>';
}

function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

function cardWrap(title, sub, estado, detail, uid) {
  const estadoHtml = estado ? '<span data-estado-uid="' + uid + '" data-value="' + escAttr(estado) + '">' + estadoBadge(estado) + '</span>' : '';
  return '<div class="card" id="card-' + uid + '"><div class="card-header" onclick="toggleCard(this)"><div><div class="card-title">' + title + '</div><div class="card-sub">' + sub + '</div></div><div class="card-right">' + estadoHtml + ' <span class="expand-arrow">&#8250;</span></div></div><div class="card-detail">' + detail + '</div></div>';
}

// Load counts
async function loadAllCounts() {
  const tables = ['conductores', 'propietarios', 'vehiculos'];
  for (const t of tables) {
    const { count, error } = await sb.from(t).select('*', { count: 'exact', head: true });
    if (!error && count != null) {
      document.getElementById('count-' + t).textContent = count;
    }
  }
}
